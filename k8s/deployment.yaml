apiVersion: apps/v1
kind: Deployment
metadata: {name: deploybot-app}
spec:
  replicas: 3
  selector: {matchLabels: {app: deploybot-app}}
  template:
    metadata: {labels: {app: deploybot-app}}
    spec:
      containers:
        - name: app
          image: deploybot-app:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /health, port: 3000}}
          livenessProbe: {httpGet: {path: /health, port: 3000}}
