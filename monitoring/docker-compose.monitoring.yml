services:
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    restart: unless-stopped
    networks: [deploybot-net]
  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment: ["GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}"]
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    restart: unless-stopped
    networks: [deploybot-net]
networks:
  deploybot-net: {external: true}
